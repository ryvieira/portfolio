<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ryan Vieira — Galeria</title>
    
    <meta name="description" content="Galeria de artes visuais e design gráfico de Ryan Vieira.">
    
    <link rel="icon" type="image/x-icon" href="img/favicon_r.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        /* Cor da seleção de texto */
        ::selection { background-color: #fff; color: #000; }

        /* Barra de rolagem customizada */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        /* BASE & RESET */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            background-color: #0a0a0a;
            color: #eee;
            font-family: "Inter", sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        body.no-scroll { overflow: hidden; }

        /* --- LÓGICA MULTILINGUE --- */
        .lang-en { display: none; }
        body.en-active .lang-pt { display: none; }
        body.en-active .lang-en { display: inline; }

        /* --- NAVEGAÇÃO SUPERIOR --- */
        header {
            padding: 0 50px;
            height: 100px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            position: fixed;
            top: 0; left: 0; width: 100%;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(12px);
            z-index: 1000;
        }

        .back-link {
            text-decoration: none; color: #444; font-size: 13px;
            text-transform: lowercase; letter-spacing: 0.2em;
            transition: color 0.3s; font-weight: 300; justify-self: start;
        }
        .back-link:hover { color: #fff; }

        .lang-switcher {
            display: flex; gap: 10px; font-size: 11px;
            letter-spacing: 0.1em; user-select: none; justify-self: center;
        }
        .lang-btn { cursor: pointer; color: #333; transition: 0.3s; }
        .lang-btn.active { color: #fff; font-weight: 600; }

        .page-id {
            color: #444; font-size: 13px; text-transform: lowercase;
            letter-spacing: 0.2em; font-weight: 300; justify-self: end;
        }

        /* --- INTRO E FILTROS --- */
        .intro-wrapper {
            max-width: 1400px; margin: 0 auto;
            padding: 180px 3rem 4rem 3rem;
            display: flex; justify-content: space-between;
            align-items: flex-end; gap: 40px;
        }

        .archive-intro { max-width: 700px; }
        .archive-intro h1 {
            font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: 700;
            margin: 0; line-height: 1; letter-spacing: -2px;
        }

        .archive-intro p {
            color: #666; font-size: 1.1rem; margin-top: 1.5rem; font-weight: 300;
        }

        .filter-bar {
            display: flex; gap: 12px; flex-wrap: wrap;
            justify-content: flex-end; margin-bottom: 10px;
        }

        .filter-btn {
            background: none; border: 1px solid #1a1a1a; color: #444;
            padding: 8px 18px; font-size: 10px; text-transform: uppercase;
            letter-spacing: 0.15em; cursor: pointer; transition: all 0.4s ease;
        }

        .filter-btn:hover { color: #888; border-color: #333; }
        .filter-btn.active { color: #fff; border-color: #fff; background: rgba(255,255,255,0.02); }

        /* --- GALERIA MASONRY --- */
        .masonry-container {
            padding: 0 3rem 4rem 3rem;
            column-count: 3; column-gap: 1.5rem;
            min-height: 100vh;
        }

        .art-item {
            display: inline-block; width: 100%; margin-bottom: 1.5rem;
            background-color: #111; position: relative; overflow: hidden;
            cursor: zoom-in; opacity: 0; transform: translateY(30px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .art-item.hidden { display: none; }
        .art-item.is-visible { opacity: 1; transform: translateY(0); }

        .art-item img {
            width: 100%; height: auto; display: block;
            transition: transform 0.6s cubic-bezier(0.2, 1, 0.3, 1);
        }

        .art-item:hover img { transform: scale(1.05); }

        /* --- NAVEGAÇÃO DE RODAPÉ --- */
        .footer-navigation-container {
            padding: 60px 3rem 100px 3rem; max-width: 1400px;
            margin: 0 auto; display: flex; justify-content: space-between; 
            border-top: 1px solid #1a1a1a;
        }

        .footer-nav-link {
            text-decoration: none; color: #fff;
            font-size: clamp(24px, 2.5vw, 32px); font-weight: 500;
            letter-spacing: -0.02em; display: flex; align-items: center;
            gap: 15px; transition: all 0.4s ease; white-space: nowrap;
        }

        .footer-nav-link .arrow { font-weight: 300; transition: transform 0.4s ease; font-size: 0.9em; }
        .footer-nav-link:hover { color: #999; }
        .footer-nav-link:hover .arrow { color: #fff; }
        .next-page-btn:hover .arrow { transform: translateX(10px); }
        .prev-page-btn:hover .arrow { transform: translateX(-10px); }

        /* --- TRANSIÇÕES --- */
        .transition-curtain-left {
            position: fixed; top: 0; left: -100%; width: 100%; height: 100%;
            background-color: #000; z-index: 9999; pointer-events: none;
            transition: left 0.8s cubic-bezier(0.8, 0, 0.2, 1);
        }
        .transition-curtain-left.active { left: 0; }

        .transition-curtain-right {
            position: fixed; top: 0; left: 100%; width: 100%; height: 100%;
            background-color: #000; z-index: 9999; pointer-events: none;
            transition: left 0.8s cubic-bezier(0.8, 0, 0.2, 1);
        }
        .transition-curtain-right.active { left: 0; }

        /* --- LIGHTBOX --- */
        #lightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(5, 5, 5, 0.98);
            backdrop-filter: blur(15px);
            display: none; justify-content: center; align-items: center;
            z-index: 2000; opacity: 0; transition: opacity 0.3s ease;
            overflow: hidden;
        }
        #lightbox.active { display: flex; opacity: 1; }
        
        #lightbox img { 
            max-width: 85%; 
            max-height: 80vh; 
            object-fit: contain; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            /* Transição base (será removida durante interações rápidas via JS) */
            transition: transform 0.2s linear; 
            cursor: zoom-in;
            user-select: none;
            -webkit-user-drag: none;
            transform-origin: center;
        }

        /* CLASSE DE ZOOM ATIVA */
        #lightbox img.zoomed {
            cursor: grab;
            max-width: none;  
            max-height: none; 
        }
        
        #lightbox img.zoomed:active {
            cursor: grabbing;
        }

        .lightbox-caption {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            color: #fff; font-family: 'Inter', sans-serif; font-size: 14px;
            font-weight: 400; text-align: center; letter-spacing: 0.05em;
            background-color: rgba(20, 20, 20, 0.6); padding: 8px 16px;
            border-radius: 20px; pointer-events: none; z-index: 2100;
            transition: opacity 0.3s;
        }
        
        #lightbox img.zoomed ~ .lightbox-caption { opacity: 0; }

        .close-lightbox { 
            position: absolute; top: 30px; right: 40px; 
            color: #fff; font-size: 35px; cursor: pointer; 
            opacity: 0.5; transition: 0.3s; z-index: 2200;
        }
        .close-lightbox:hover { opacity: 1; }

        .nav-arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: #fff; font-size: 40px;
            cursor: pointer; padding: 20px; opacity: 0.3;
            transition: 0.3s; user-select: none; z-index: 2100;
        }
        .nav-arrow:hover { opacity: 1; }
        .prev-arrow { left: 30px; }
        .next-arrow { right: 30px; }

        @media (max-width: 900px) {
            header { grid-template-columns: 1fr 1fr; padding: 20px 30px; height: auto; gap: 10px; }
            .lang-switcher { grid-row: 2; grid-column: 1 / span 2; margin: 10px 0; }
            .masonry-container { column-count: 1; padding: 0 1.5rem 4rem 1.5rem; }
            .intro-wrapper { padding: 140px 1.5rem 2rem 1.5rem; flex-direction: column; align-items: flex-start; }
            .nav-arrow { display: none; } 
            .lightbox-caption { bottom: 20px; font-size: 12px; width: 90%; }
            
            .footer-navigation-container { 
                flex-direction: column; gap: 40px; 
                padding: 40px 1.5rem 80px 1.5rem; 
            }
            .footer-nav-link { font-size: 24px; }
            .prev-page-btn { align-self: flex-start; }
            .next-page-btn { align-self: flex-end; }
        }
    </style>
</head>
<body>

    <div class="transition-curtain-left"></div>
    <div class="transition-curtain-right"></div>

    <header>
        <a href="index.html" class="back-link"><span class="lang-pt">← voltar</span><span class="lang-en">← back</span></a>
        <div class="lang-switcher">
            <span id="btn-pt" class="lang-btn active" onclick="switchLang('pt')">PT</span>
            <span style="color: #111;">|</span>
            <span id="btn-en" class="lang-btn" onclick="switchLang('en')">EN</span>
        </div>
        <div class="page-id">ryan vieira — <span class="lang-pt">galeria</span><span class="lang-en">gallery</span></div>

    <main>
        <div class="intro-wrapper">

        <div class="footer-navigation-container">
            <a href="projetos.html" class="footer-nav-link prev-page-btn">
                <span class="arrow">←</span>
                <span class="lang-pt">Projetos</span>
                <span class="lang-en">Projects</span>
            </a>

            <a href="sobre.html" class="footer-nav-link next-page-btn">
                <span class="lang-pt">Sobre</span>

            </a>

    </main>

    <div id="lightbox">
        <span class="close-lightbox">&times;</span>
        <button class="nav-arrow prev-arrow">&#10094;</button>
        <button class="nav-arrow next-arrow">&#10095;</button>
        <img src="" alt="Zoom">
        <div class="lightbox-caption"></div>
    </div>

    <script>
        const bodyEl = document.body;
        let visibleImages = [];
        let currentImgIndex = 0;

        function switchLang(lang) {
            bodyEl.classList.toggle('en-active', lang === 'en');
            localStorage.setItem('ryanLang', lang);
            document.getElementById('btn-pt').classList.toggle('active', lang === 'pt');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
        }

        const filterBtns = document.querySelectorAll('.filter-btn');
        const artItems = document.querySelectorAll('.art-item');

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const filterValue = btn.getAttribute('data-filter');

                artItems.forEach(item => {
                    item.classList.remove('is-visible');
                    if (filterValue === 'all' || item.getAttribute('data-category') === filterValue) {
                        item.classList.remove('hidden');
                        setTimeout(() => item.classList.add('is-visible'), 100);
                    } else {
                        item.classList.add('hidden');
                    }
                });
                updateVisibleImages();
            });
        });

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = lightbox.querySelector('img');
        const lightboxCaption = lightbox.querySelector('.lightbox-caption');

        function updateVisibleImages() {
            visibleImages = Array.from(document.querySelectorAll('.art-item:not(.hidden) img'));
        }

        // --- LÓGICA DE ZOOM E DRAG REFINADA (MOUSE WHEEL) ---
        let isDragging = false;
        let startX, startY;
        let translateX = 0, translateY = 0;
        let scale = 1; // Escala dinâmica

        function updateTransform() {
            // Aplica a transformação com os valores atuais
            lightboxImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
            
            // Controle de cursor e classe
            if (scale > 1) {
                lightboxImg.classList.add('zoomed');
            } else {
                lightboxImg.classList.remove('zoomed');
            }
        }

        function resetZoomState() {
            scale = 1;
            translateX = 0;
            translateY = 0;
            updateTransform();
        }

        function openLightbox(index) {
            currentImgIndex = index;
            const currentImage = visibleImages[currentImgIndex];
            
            // Reset antes de mostrar
            lightboxImg.style.transition = 'none'; // Evita animação na abertura
            resetZoomState();
            
            lightboxImg.src = currentImage.src;
            lightboxCaption.innerText = currentImage.alt;
            lightbox.classList.add('active');
            bodyEl.classList.add('no-scroll');
            
            // Reabilita transição após um frame
            setTimeout(() => {
                lightboxImg.style.transition = 'transform 0.2s linear';
            }, 10);
        }

        function navigate(direction) {
            currentImgIndex = (currentImgIndex + direction + visibleImages.length) % visibleImages.length;
            const nextImage = visibleImages[currentImgIndex];
            
            lightboxImg.style.transition = 'none'; // Evita animação na troca
            resetZoomState();
            
            lightboxImg.src = nextImage.src;
            lightboxCaption.innerText = nextImage.alt;
            
            setTimeout(() => {
                lightboxImg.style.transition = 'transform 0.2s linear';
            }, 10);
        }

        // --- EVENTO: MOUSE WHEEL (RODA DO MOUSE) ---
        lightboxImg.addEventListener('wheel', (e) => {
            e.preventDefault(); // Impede rolagem da página

            // Define a sensibilidade e direção
            const delta = e.deltaY * -0.005; 
            const newScale = Math.min(Math.max(1, scale + delta), 5); // Min 1x, Max 5x

            scale = newScale;
            
            // Se voltar para 1x, reseta a posição (centraliza)
            if (scale === 1) {
                translateX = 0;
                translateY = 0;
            }

            lightboxImg.style.transition = 'transform 0.1s ease-out'; // Movimento suave do wheel
            updateTransform();
        });

        // --- EVENTOS DE CLIQUE NA IMAGEM (ZOOM TOGGLE) ---
        let isDragAction = false; 

        lightboxImg.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isDragAction) return; 

            lightboxImg.style.transition = 'transform 0.3s ease'; // Transição suave para clique

            if (scale > 1) {
                // Zoom Out
                scale = 1;
                translateX = 0;
                translateY = 0;
            } else {
                // Zoom In Padrão
                scale = 2.5; 
            }
            updateTransform();
        });

        // --- DRAG EVENTS (MOUSE & TOUCH) ---
        function startDrag(clientX, clientY) {
            if (scale <= 1) return; // Só arrasta se tiver zoom
            isDragging = true;
            isDragAction = false;
            startX = clientX - translateX;
            startY = clientY - translateY;
            lightboxImg.style.transition = 'none'; // Remove delay para arraste instantâneo
        }

        function moveDrag(clientX, clientY) {
            if (!isDragging) return;
            isDragAction = true;
            translateX = clientX - startX;
            translateY = clientY - startY;
            updateTransform();
        }

        function endDrag() {
            isDragging = false;
            // Opcional: Adicionar "momentum" ou limites de borda aqui futuramente
        }

        // Mouse Listeners
        lightboxImg.addEventListener('mousedown', (e) => { e.preventDefault(); startDrag(e.clientX, e.clientY); });
        window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
        window.addEventListener('mouseup', endDrag);

        // Touch Listeners
        lightboxImg.addEventListener('touchstart', (e) => { 
            if (e.touches.length === 1) startDrag(e.touches[0].clientX, e.touches[0].clientY);
        });
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1) moveDrag(e.touches[0].clientX, e.touches[0].clientY);
        });
        window.addEventListener('touchend', endDrag);

        // --- FIM LÓGICA ZOOM ---

        artItems.forEach(item => {
            item.addEventListener('click', () => {
                const img = item.querySelector('img');
                const index = visibleImages.indexOf(img);
                openLightbox(index);
            });
        });

        document.querySelector('.next-arrow').addEventListener('click', (e) => { e.stopPropagation(); navigate(1); });
        document.querySelector('.prev-arrow').addEventListener('click', (e) => { e.stopPropagation(); navigate(-1); });
        
        function closeLightbox() {
            lightbox.classList.remove('active');
            bodyEl.classList.remove('no-scroll');
            resetZoomState();
        }

        document.querySelector('.close-lightbox').addEventListener('click', closeLightbox);

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                closeLightbox();
            }
        });

        window.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'ArrowRight') navigate(1);
            if (e.key === 'ArrowLeft') navigate(-1);
            if (e.key === 'Escape') closeLightbox();
        });

        // --- TRANSIÇÕES ---
        const curtainLeft = document.querySelector('.transition-curtain-left');
        const curtainRight = document.querySelector('.transition-curtain-right');
        const prevPageBtn = document.querySelector('.prev-page-btn'); 
        const nextPageBtn = document.querySelector('.next-page-btn'); 

        if(prevPageBtn) {
            prevPageBtn.addEventListener('click', (e) => {
                e.preventDefault();
                const url = prevPageBtn.href;
                curtainLeft.classList.add('active');
                setTimeout(() => window.location.href = url, 800);
            });
        }

        if(nextPageBtn) {
            nextPageBtn.addEventListener('click', (e) => {
                e.preventDefault();
                const url = nextPageBtn.href;
                curtainRight.classList.add('active');
                setTimeout(() => window.location.href = url, 800);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('ryanLang');
            if (savedLang) switchLang(savedLang);
            updateVisibleImages();

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('is-visible'); });
            }, { threshold: 0.1 });
            artItems.forEach(item => observer.observe(item));
        });
    </script>
</body>
</html>
